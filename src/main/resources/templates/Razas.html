                        </ol>
                    </div>

        <!-- Main content -->
        <section class="content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">Mantenimiento de Razas</h3>&nbsp;
                                <div class="d-flex justify-content-end">
                                    <button type="button" class="btn btn-success" data-toggle="modal" data-target="#modal-raza">

                                    </button>
                                </div>
                            </div>
                            <div class="card-body">
                                <table id="exampleRazas" class="table table-bordered table-striped">

                                    </thead>
                                    <tbody>

                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="modal fade" id="modal-raza">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h4 class="modal-title">Agregar nueva raza</h4>
                                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                            <span aria-hidden="true">&times;</span>
                                        </button>
                                    </div>
                                    <div class="modal-body">
                                        <form>
                                            <div class="card-body">
                                                <div class="form-group">
                                                    <label for="nombreRaza">Nombre de la raza:</label>
                                                    <input type="text" class="form-control" id="nombreRaza" placeholder="Ej. Husky, Pastor Alemán...">
                                                </div>
                                            </div>
                                        </form>
                                    </div>
                                    <div class="modal-footer justify-content-between">
                                        <button type="button" class="btn btn-default" data-dismiss="modal">Cerrar</button>
                                        <button type="button" class="btn btn-success" onclick="guardarRaza();" data-dismiss="modal">Guardar raza</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

<!-- Page specific script -->
<script>
    $(function () {
        // Inicializar DataTables para la tabla de razas
        var table = $("#exampleRazas").DataTable({
            "responsive": true, "lengthChange": false, "autoWidth": false,
            "buttons": ["copy", "csv", "excel", "pdf", "print", "colvis"]
        });
        table.buttons().container().appendTo('#exampleRazas_wrapper .col-md-6:eq(0)');

        // Llamar a la función para llenar la tabla
        listarRazas();
    });
</script>
